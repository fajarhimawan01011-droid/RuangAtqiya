"pasangan 10":[["🔟","Apa itu pasangan 10?","Dua angka yang kalau dijumlahkan hasilnya 10. Ambil 10 kancing, bagi jadi dua kelompok: 3 kancing di kiri dan 7 kancing di kanan. 3 + 7 = 10.","Kalau di kiri ada 4, di kanan ada berapa?","6, karena 4 + 6 = 10."],["📋","Semua pasangan 10","1+9, 2+8, 3+7, 4+6, 5+5. Lihat polanya: angka pertama naik 1, angka kedua turun 1.","Kenapa 5 + 5 istimewa?","Karena kedua kelompoknya sama banyak."],["⚡","Kenapa penting?","Kalau hafal pasangan 10, menjumlah jadi cepat. Ini dasar untuk soal yang lebih besar nanti, misalnya 8 + 5.","Kalau hafal 7 + 3 = 10, berapa 3 + 7?","10, urutan angka tidak mengubah hasil."],["➖","Pasangan 10 untuk mengurang","Kalau 3 + 7 = 10, maka 10 − 3 = 7 dan 10 − 7 = 3. Penjumlahan dan pengurangan saling berhubungan.","Kalau 6 + 4 = 10, berapa 10 − 6?","4."],["📊","Gambar soalnya dengan batang","Soal cerita bisa digambar sebagai batang. Batang yang disambung berarti menggabung (tambah). Batang yang sebagian diambil berarti kurang. Tanda ? menunjukkan yang dicari. Ini cara belajar matematika di Singapura (bar model).","Ada 4 mobil merah dan 6 mobil hijau. Batangnya ada berapa bagian?","Dua bagian, 4 dan 6, lalu digabung menjadi satu bagian besar yang dicari: ?."]],
"Matematika: pola":[["🔴🔵","Pola adalah susunan yang berulang","Merah, biru, merah, biru, dan seterusnya. Bagian yang berulang disebut aturan pola. Untuk menebak yang berikutnya, cari dulu aturannya.","Apa aturan pola 🔴🔵🔴🔵?","Merah lalu biru, diulang terus."],["🍎🍎🍌","Aturan yang lebih panjang","Apel, apel, pisang, apel, apel, pisang. Aturannya: dua apel, satu pisang. Hitung berapa kali bagian itu muncul.","Setelah 🍎🍎🍌🍎🍎, apa berikutnya?","Pisang 🍌, karena aturannya dua apel lalu satu pisang."],["👏","Pola ada di gerakan dan bunyi","Tepuk, tepuk, jentik, tepuk, tepuk, jentik adalah pola gerakan. Lagu dan batik juga punya pola.","Sebutkan satu pola di sekitar rumahmu.","Misalnya ubin, gorden, atau baju bergaris."],["🐸","Pola angka: lompat","Lompat 2: 2, 4, 6, 8. Lompat 5: 5, 10, 15, 20. Setiap lompatan menambah angka yang sama.","Lompat 5 dari 5, angka keduanya berapa?","10, karena 5 + 5."]],
"genapkan ke 10":[["🧮","Cari 10 dulu","Untuk 8 + 5: angka 8 butuh 2 supaya jadi 10. Jadi kita ambil 2 dari angka 5.","Sisa dari 5 setelah diambil 2 berapa?","3."],["✨","Lalu tambah sisanya","10 + 3 = 13, jadi 8 + 5 = 13. Cara ini lebih cepat dan lebih sedikit salah daripada menghitung satu-satu.","Untuk 9 + 4, berapa yang diambil dari 4 supaya 9 jadi 10?","1. Sisa 3, jadi 10 + 3 = 13."],["🔍","Mengecek jawaban","Kita bisa cek: 13 − 5 harus kembali ke 8. Mengecek membuat kita yakin.","Cek 7 + 6 = 13 dengan pengurangan.","13 − 6 = 7, jadi benar."]],
"Matematika: logika":[["🧩","Logika itu berpikir urut","Sari lebih tinggi dari Dina, dan Dina lebih tinggi dari Rani. Maka Sari paling tinggi dan Rani paling pendek.","Siapa yang di tengah?","Dina."],["✏️","Menggambar membantu","Soal cerita lebih mudah kalau digambar. Gambar 5 burung, coret 2 yang terbang, tambah 1 yang datang.","Jadi ada berapa burung?","4, karena 5 − 2 = 3, lalu 3 + 1 = 4."],["🕵️","Cari petunjuk","Teka-teki bilangan: baca satu petunjuk, coret angka yang tidak cocok, sampai tersisa satu.","Aku genap, lebih dari 7 dan kurang dari 10. Aku siapa?","8."]],
"dadu 10":[["🎲","Dadu dan angka","Satu dadu menunjukkan 1 sampai 6. Dua dadu dijumlahkan: paling kecil 2, paling besar 12.","Kenapa tidak mungkin dapat jumlah 1?","Karena paling kecil tiap dadu 1, jadi 1 + 1 = 2."],["🎯","Kurang berapa ke 10?","Dapat 6 + 3 = 9, kurang 1 supaya 10. Ini memakai pasangan 10 yang sudah kita hafal.","Kalau dapat 4 + 4 = 8, kurang berapa?","2."],["🤔","Mencari strategi","Mana lebih mudah dapat 10: 5 + 5 atau 6 + 4? Keduanya bisa. Ada banyak kombinasi yang menghasilkan 10.","Sebutkan satu kombinasi dua dadu yang jumlahnya 10.","4 dan 6, atau 5 dan 5."]],
"belanja":[["🪙","Uang dan harga","Permen Rp3 ribu dan biskuit Rp4 ribu. Totalnya 3 + 4 = Rp7 ribu. Itulah yang harus dibayar.","Kalau bayar Rp10 ribu, kembaliannya berapa?","Rp3 ribu, karena 10 − 7 = 3."],["🤝","Mengecek kembalian","Kembalian ditambah belanjaan harus sama dengan uang yang dibayar. Kalau tidak sama, ada yang salah hitung.","Belanja Rp6 ribu, kembalian Rp4 ribu. Uangnya berapa?","Rp10 ribu, karena 6 + 4 = 10."],["🧠","Memilih dengan bijak","Kalau punya uang Rp10 ribu, kita bisa memilih barang yang jumlahnya tidak lebih dari uang kita.","Uang Rp5 ribu: boleh beli barang Rp3 ribu dan Rp4 ribu?","Tidak, karena jumlahnya Rp7 ribu, lebih dari Rp5 ribu."]],
"English: Family":[["👨‍👩‍👧","Father dan mother","Father = ayah (dibaca “fa-der”). Mother = ibu (dibaca “ma-der”). Family = keluarga (dibaca “fem-i-li”).","Siapa yang kamu panggil mother?","Ibu."],["👧👦","Sister dan brother","Sister = saudara perempuan (“sis-ter”). Brother = saudara laki-laki (“bra-der”). Kakak atau adik boleh disebut sister atau brother.","Kalau kamu punya adik laki-laki, dia disebut apa?","Brother."],["👴👵","Grandfather dan grandmother","Grandfather = kakek. Grandmother = nenek. Mereka orang tua dari ayah atau ibu kita.","Apa bahasa Inggris nenek?","Grandmother."],["👶","Baby","Baby = bayi (“bei-bi”). Dalam satu family bisa ada father, mother, sister, brother, grandfather, grandmother, dan baby.","Sebutkan anggota family di rumahmu dalam bahasa Inggris.","Contoh: father, mother, sister."]],
"word family -at":[["🐱","Satu akhiran, banyak kata","Akhiran -at sama dalam cat, hat, bat, mat, rat. Hanya huruf depan yang berganti: c, h, b, m, r.","Kalau c diganti h, jadi kata apa?","hat."],["🔤","Cara membaca","Baca huruf depan, lalu gabungkan dengan -at. Contoh: b + at = bat. Ucapkan pelan-pelan lalu makin cepat.","Baca: m + at.","mat."],["📖","Membaca kalimat","The cat is on the mat. Artinya: kucing itu ada di atas tikar. Kata the artinya itu.","Siapa yang ada di atas tikar?","The cat, yaitu kucing."]],
"kalimat pertama":[["✍️","This is my ...","This is my mother artinya: Ini ibuku. This = ini, is = adalah, my = milikku.","Apa arti my?","Milikku atau -ku."],["🔠","Aturan menulis kalimat","Awal kalimat pakai huruf besar, akhir kalimat pakai titik. Jarak antar kata sebesar satu jari.","Mana yang benar: this is my father. atau This is my father.?","This is my father., karena memakai huruf besar dan titik."],["🔁","Ganti kata terakhir","This is my sister. This is my brother. This is my grandmother. Hanya kata terakhir yang berganti.","Bagaimana menulis “Ini kakekku”?","This is my grandfather."]],
"lagu dan tanya jawab":[["❓","Who is this?","Who is this? artinya: Ini siapa? Kita jawab dengan: This is my grandmother. Who = siapa.","Apa arti Who?","Siapa."],["🗣️","Tanya dan jawab bergantian","Satu orang bertanya Who is this?, yang lain menjawab sambil menunjuk foto. Lalu bertukar peran.","Siapa yang bertanya lebih dulu kalau Ayah menunjuk foto nenek?","Ayah bertanya, lalu kamu menjawab: This is my grandmother."],["🎵","Belajar lewat lagu","Lagu Finger Family menyebut father, mother, brother, sister, baby. Menyanyi membuat kata mudah diingat.","Sebutkan anggota keluarga di lagu itu.","Father, mother, brother, sister, baby."]],
"game review":[["🧠","Kata -an","Akhiran -an dalam man, can, fan, pan, van. Sama seperti -at, hanya huruf depan yang berganti.","Kalau m diganti c, jadi kata apa?","can."],["🔎","Beda -at dan -an","cat berakhiran -at, can berakhiran -an. Lihat huruf terakhir untuk membedakan.","Huruf terakhir kata fan apa?","n, jadi fan berakhiran -an."],["🔁","Mengulang membuat ingat","Ulangi kata baru 3 kali: lihat gambar, ucapkan, lalu tulis.","Kenapa mengulang membantu?","Supaya otak terbiasa dan tidak mudah lupa."]],
"English: santai":[["📚","Cerita bergambar","Gambar membantu kita menebak arti kata baru, walau belum paham semuanya.","Bagaimana menebak arti kata dari gambar?","Lihat apa yang digambar lalu cocokkan dengan kata."],["🎬","Mendengar bahasa Inggris","Tidak apa-apa kalau belum paham semua. Dengarkan kata yang sudah kamu tahu, seperti cat, mother, atau baby.","Kata apa yang kamu kenali di cerita tadi?","Jawaban bebas, misalnya cat."]],
"panca indera":[["🧍","Kita punya lima indera","Mata untuk melihat, telinga untuk mendengar, hidung untuk mencium, lidah untuk mengecap, kulit untuk meraba. Indera membantu kita mengenal dunia.","Sebutkan lima indera tanpa melihat kartu.","Mata, telinga, hidung, lidah, kulit."],["👀","Mata untuk melihat","Dengan mata kita melihat warna, bentuk, dan ukuran. Jaga mata: jangan menggosok dengan tangan kotor dan jangan menonton layar terlalu dekat.","Kenapa jangan menonton terlalu dekat?","Supaya mata tidak lelah dan sakit."],["👂","Telinga untuk mendengar","Dengan telinga kita mendengar suara, dari bisikan sampai klakson. Jaga telinga: jangan memasukkan benda keras dan jangan mendengar suara terlalu keras.","Kenapa suara terlalu keras berbahaya?","Bisa membuat telinga sakit."],["👃👅","Hidung dan lidah","Hidung mencium bau harum atau busuk. Lidah mengecap rasa manis, asin, asam, dan pahit. Hidung dan lidah bekerja sama saat kita makan.","Kenapa makanan terasa kurang enak saat hidung tersumbat?","Karena bau ikut membantu kita merasakan makanan."],["✋","Kulit untuk meraba","Kulit meraba halus atau kasar, panas atau dingin. Kulit juga melindungi tubuh. Jaga kulit dengan mandi dan memakai pakaian bersih.","Bagaimana kita tahu air itu panas?","Dengan kulit, saat kita menyentuhnya."]],
"bagian tumbuhan":[["🌳","Tumbuhan adalah makhluk hidup","Tumbuhan hidup: ia tumbuh besar, butuh air dan cahaya matahari, dan bisa berkembang biak. Tubuh tumbuhan punya bagian: akar, batang, daun, bunga, buah, dan biji.","Apa tanda tumbuhan itu hidup?","Ia tumbuh, butuh air, dan bisa berkembang biak."],["🌱","Akar: kaki tumbuhan di dalam tanah","Akar ada di dalam tanah. Fungsinya: 1) menyerap air dan zat makanan dari tanah, 2) menahan tumbuhan agar tegak tidak roboh, 3) pada wortel dan singkong, akar menyimpan makanan sehingga bisa kita makan.","Kalau akarnya putus, apa yang terjadi pada tumbuhan?","Tumbuhan sulit mendapat air, lalu layu dan mudah roboh."],["🪵","Batang: penopang dan jalan air","Batang menopang daun, bunga, dan buah agar tinggi dan menerima cahaya. Di dalam batang ada saluran kecil yang mengalirkan air dari akar ke daun dan membawa makanan dari daun ke bagian lain.","Kenapa pohon besar punya batang besar?","Supaya kuat menopang banyak daun dan buah."],["🍃","Daun: dapur tumbuhan","Daun berwarna hijau. Di daun, tumbuhan membuat makanannya dari cahaya matahari, air, dan udara. Daun punya tulang daun untuk mengalirkan air. Bentuk daun beda-beda: bulat, panjang, atau berjari.","Kenapa tanaman di tempat gelap menjadi pucat dan lemas?","Karena daun tidak mendapat cahaya untuk membuat makanan."],["🌸","Bunga: calon buah","Bunga berwarna dan harum untuk mengundang lebah dan kupu-kupu. Setelah lebah membantu, bunga bisa berubah menjadi buah.","Kenapa bunga punya warna cerah?","Supaya menarik lebah dan kupu-kupu."],["🍎","Buah dan biji","Buah melindungi biji di dalamnya. Biji adalah calon tumbuhan baru. Hewan dan manusia yang makan buah membantu menyebarkan biji.","Kalau biji ditanam di tanah dan disiram, jadi apa?","Tumbuhan baru."],["🌰","Dari biji menjadi pohon","Biji → kecambah (tunas kecil) → tumbuhan kecil → tumbuhan besar. Prosesnya butuh waktu, air, cahaya matahari, dan tanah.","Urutan mana yang benar: biji, kecambah, pohon atau pohon, biji, kecambah?","Biji, kecambah, pohon."],["🌍","Tumbuhan berguna bagi kita","Tumbuhan memberi makanan (sayur dan buah), tempat teduh, dan udara segar. Karena itu kita menyiram dan tidak merusak tanaman.","Sebutkan satu tumbuhan yang kamu makan.","Contoh: bayam, pisang, atau padi."]],
"hewan di sekitar kita":[["🐾","Hewan adalah makhluk hidup","Hewan bergerak, makan, tumbuh, dan berkembang biak. Hewan berbeda dari tumbuhan karena hewan bisa berpindah tempat untuk mencari makan.","Apa bedanya hewan dan tumbuhan?","Hewan bisa berpindah tempat, tumbuhan menetap di tanah."],["🌊","Tempat hidup hewan","Hewan darat seperti sapi dan ayam. Hewan air seperti ikan. Hewan udara atau yang bisa terbang seperti burung. Katak hidup di air dan di darat.","Kenapa ikan tidak bisa hidup di darat?","Tubuh ikan cocok untuk hidup di air."],["🌿","Makanan hewan","Sapi dan kambing makan tumbuhan. Singa makan daging. Ayam makan biji dan cacing. Setiap hewan punya makanan yang cocok.","Apa yang terjadi kalau sapi diberi daging?","Tidak cocok, sapi memakan rumput dan tumbuhan."],["🪶","Penutup tubuh","Ayam dan burung berbulu. Ikan bersisik. Kucing dan kambing berambut. Penutup tubuh melindungi hewan.","Kenapa ayam punya bulu?","Untuk melindungi dan menghangatkan tubuh."],["🥚","Berkembang biak","Ada hewan yang bertelur seperti ayam dan ikan. Ada yang melahirkan seperti kucing dan sapi. Kita menyayangi hewan dengan memberinya makan dan tidak menyakitinya.","Hewan apa yang bertelur?","Contoh: ayam, ikan, bebek."]],
"IPA: tata surya":[["☀️","Matahari adalah bintang","Matahari memberi cahaya dan panas. Bintang lain terlihat kecil karena sangat jauh. Jangan melihat Matahari langsung dengan mata.","Kenapa jangan melihat Matahari langsung?","Cahayanya sangat terang dan bisa merusak mata."],["🪐","Delapan planet","Planet-planet mengelilingi Matahari: Merkurius, Venus, Bumi, Mars, Jupiter, Saturnus, Uranus, Neptunus. Merkurius paling dekat dengan Matahari, Neptunus paling jauh.","Ada berapa planet, dan mana yang paling dekat Matahari?","Delapan, dan Merkurius."],["🌍","Bumi tempat tinggal kita","Bumi satu-satunya planet yang diketahui ada kehidupannya. Di Bumi ada air, udara, dan jaraknya cocok dari Matahari.","Kenapa makhluk hidup bisa tinggal di Bumi?","Ada air, udara, dan suhu yang cocok."],["🌕","Bulan mengelilingi Bumi","Bulan bukan planet. Bulan mengelilingi Bumi, dan cahayanya berasal dari pantulan sinar Matahari.","Apakah Bulan menyala sendiri?","Tidak, ia memantulkan cahaya Matahari."],["🔭","Planet istimewa","Jupiter planet terbesar. Saturnus punya cincin. Mars tampak kemerahan. Venus planet terpanas.","Planet mana yang punya cincin?","Saturnus."]],
"cuaca, siang, dan malam":[["🌦️","Macam-macam cuaca","Cuaca bisa cerah, berawan, hujan, atau berangin. Cuaca bisa berubah dalam sehari.","Apa yang kita pakai saat hujan?","Payung atau jas hujan."],["💧","Dari mana hujan datang?","Air di laut dan sungai menguap karena panas Matahari, naik menjadi awan, lalu jatuh sebagai hujan.","Apa yang membuat air menguap?","Panas Matahari."],["🌗","Siang dan malam","Bumi berputar sehingga bagian yang menghadap Matahari terang (siang) dan yang membelakangi gelap (malam).","Kenapa malam gelap?","Karena bagian Bumi tempat kita membelakangi Matahari."],["👕","Memilih pakaian","Saat panas pakai baju tipis dan topi. Saat hujan pakai jas hujan. Memilih pakaian sesuai cuaca menjaga badan sehat.","Kamu pakai apa kalau cuaca panas?","Baju tipis dan topi."]],
"keluargaku":[["👨‍👩‍👧","Anggota keluarga","Keluarga terdiri dari ayah, ibu, dan anak. Ada juga kakek, nenek, paman, dan bibi. Anggota keluarga saling menyayangi.","Siapa saja anggota keluargamu?","Jawaban bebas."],["🧹","Tugas dan kerja sama","Ayah dan ibu mencari nafkah dan mengurus rumah. Anak membantu, misalnya merapikan mainan.","Apa tugasmu di rumah?","Misalnya merapikan mainan."],["🤔","Kenapa harus saling bantu?","Kalau semua membantu, pekerjaan cepat selesai dan rumah nyaman.","Kalau tidak ada yang membereskan rumah, apa yang terjadi?","Rumah jadi berantakan."],["🏠","Rumah dan alamat","Rumah tempat berlindung dan berkumpul. Alamat membantu orang menemukan rumah kita.","Kenapa kita perlu hafal alamat rumah?","Supaya bisa pulang atau minta bantuan kalau tersesat."]],
"sekolahku":[["🏫","Tempat di sekolah","Ada kelas, perpustakaan, kantin, lapangan, dan toilet. Setiap tempat punya fungsi.","Di mana kita membaca buku?","Perpustakaan."],["📏","Aturan sekolah","Aturan membuat sekolah aman dan tertib, misalnya datang tepat waktu dan antre.","Kenapa antre itu baik?","Supaya adil dan tidak berdesakan."],["🧑‍🏫","Guru dan petugas","Guru mengajar, penjaga sekolah menjaga keamanan. Kita berterima kasih kepada mereka.","Bagaimana cara berterima kasih kepada guru?","Mendengarkan, menyapa, dan mengucapkan terima kasih."],["🤝","Teman","Teman belajar dan bermain bersama. Kita saling menghargai dan membantu.","Kalau teman sedih, apa yang bisa kamu lakukan?","Menghibur dan menemaninya."]],
"kiri, kanan":[["⬅️➡️","Arah di sekitar kita","Kiri, kanan, depan, belakang, atas, dan bawah menjelaskan letak benda.","Bagaimana menjelaskan letak buku di meja?","Buku ada di atas meja."],["🔀","Arah tergantung kita","Kiri dan kanan bergantung pada arah badan kita. Kalau kita berbalik, kiri dan kanan berpindah.","Kalau kamu berbalik badan, kiri jadi di mana?","Kiri tetap di sisi tubuhmu, tetapi menunjuk ke arah yang berbeda dari tadi."],["🏠","Denah","Denah adalah gambar ruangan dilihat dari atas. Dengan denah kita tahu letak benda.","Kenapa denah berguna?","Supaya mudah mencari letak benda."]],
"IPS: pekerjaan":[["👷","Banyak pekerjaan","Dokter merawat orang sakit, petani menanam padi, guru mengajar, polisi menjaga keamanan, pemadam kebakaran memadamkan api.","Siapa yang membantu saat kita sakit?","Dokter."],["🏥","Tempat bekerja","Dokter bekerja di rumah sakit, guru di sekolah, petani di sawah. Tempat bekerja sesuai tugasnya.","Di mana petani bekerja?","Di sawah atau kebun."],["🌾","Saling membutuhkan","Petani menanam padi, juru masak memasaknya. Pekerjaan saling melengkapi.","Kalau tidak ada petani, apa yang terjadi?","Bahan makanan jadi sulit didapat."],["🌟","Cita-cita","Setiap pekerjaan baik itu mulia. Untuk jadi dokter atau guru, kita rajin belajar dari sekarang.","Kamu ingin jadi apa dan apa yang bisa dilakukan sekarang?","Jawaban bebas, misalnya rajin belajar."]],
"peta, arah mata angin":[["🧭","Empat arah mata angin","Utara, selatan, timur, dan barat. Matahari terbit di timur dan terbenam di barat.","Matahari terbit dari arah mana?","Timur."],["📍","Kompas","Kompas punya jarum yang selalu menunjuk ke utara. Dari utara kita bisa tahu arah lain.","Kalau menghadap utara, belakang kita arah apa?","Selatan."],["🗺️","Apa itu peta?","Peta adalah gambar tempat dilihat dari atas. Utara biasanya di bagian atas peta.","Kalau rumah sakit di atas sekolah pada peta, di arah mana?","Utara."],["🚶","Membaca peta","Cari tempat pusat, lalu lihat arah ke tempat lain: atas utara, bawah selatan, kanan timur, kiri barat.","Pasar di bawah sekolah. Pasar ada di arah mana?","Selatan."],["🏙️","Kota dan desa","Desa banyak sawah dan kebun. Kota banyak gedung dan toko.","Di mana lebih banyak sawah?","Desa."]]};

Sx("m","🔢 Matematika: bilangan 11–20",[["🔢","Bilangan 11 sampai 20","Setelah 10 ada 11, 12, 13, sampai 20. Bilangan 11 sampai 19 terdiri dari satu puluhan dan beberapa satuan. 14 = 10 + 4.","14 terdiri dari berapa puluhan dan berapa satuan?","1 puluhan dan 4 satuan."],["🧩","Menyusun bilangan","10 kancing ditambah 6 kancing menjadi 16. Angka 1 menunjukkan puluhan dan angka 6 menunjukkan satuan.","16 itu 10 ditambah berapa?","6."]],[["12 = 10 + ☐",["1","2","3"],"2"],["Setelah 15 adalah ...",["14","16","17"],"16"],["1 puluhan dan 8 satuan adalah ...",["18","81","19"],"18"],["Bilangan sebelum 20 adalah ...",["19","21","10"],"19"]]),
Sx("e","🗣️ English: warna",[["🌈","Colors = warna","red (merah), blue (biru), yellow (kuning), green (hijau). Ucapan: red “red”, blue “blu”, yellow “yelo”, green “grin”.","Apa bahasa Inggris hijau?","Green."],["🎨","Lebih banyak warna","black (hitam), white (putih), pink (merah muda), orange (oranye). Orange juga berarti jeruk.","Apa bahasa Inggris hitam?","Black."]],[["Apa bahasa Inggrisnya?",["red","blue","green"],"red","🔴"],["Apa bahasa Inggrisnya?",["blue","black","pink"],"blue","🔵"],["Apa bahasa Inggrisnya?",["yellow","white","green"],"yellow","🟡"],["Apa bahasa Inggrisnya?",["green","red","blue"],"green","🟢"],["Apa bahasa Inggrisnya?",["black","white","pink"],"black","⚫"]]),
Sx("i","🧱 IPA: sifat benda",[["🧱","Benda punya sifat","Benda bisa keras atau lunak, kasar atau halus, berat atau ringan. Batu keras, spons lunak, amplas kasar, sutra halus.","Batu keras atau lunak?","Keras."],["🔍","Memilih benda","Kita memilih benda sesuai sifatnya. Panci dari logam karena kuat dan tahan panas. Bantal lunak supaya nyaman.","Kenapa bantal dibuat lunak?","Supaya nyaman untuk tidur."]],[["Benda yang lunak adalah ...",["spons","batu","besi"],"spons","🧽"],["Benda yang kasar adalah ...",["amplas","kaca","sutra"],"amplas"],["Benda yang berat adalah ...",["batu besar","daun","bulu"],"batu besar","🪨"]]),
Sx("i","🏘️ IPS: tetangga dan tolong-menolong",[["🏘️","Tetangga","Tetangga adalah orang yang tinggal dekat rumah kita. Kita menyapa dengan ramah dan saling membantu.","Apa yang kamu lakukan saat bertemu tetangga?","Menyapa dengan ramah."],["🤝","Tolong-menolong","Membantu tetangga membawa belanjaan atau meminjamkan alat. Menolong membuat hidup bersama menyenangkan.","Kenapa kita perlu tolong-menolong?","Karena kita saling membutuhkan."]],[["Tetangga adalah ...",["orang yang tinggal dekat rumah","teman sekelas","guru"],"orang yang tinggal dekat rumah","🏘️"],["Tetangga membawa barang berat. Kita ...",["membantu","menonton saja","pergi"],"membantu"],["Menolong tetangga membuat hidup ...",["menyenangkan","sulit","sepi"],"menyenangkan"]]),
Sx("t","🔬 Percobaan 3: es mencair",[["🧊","Es mencair di mana lebih cepat?","Siapkan 2 es batu sama besar di dua piring: satu di tempat teduh, satu di tempat terkena sinar matahari.","Tebak dulu: es mana yang lebih dulu mencair?","Es di tempat panas."],["📏","Tes yang adil","Dua es harus sama besar dan sama wadahnya. Hanya tempatnya yang berbeda.","Kenapa dua es harus sama besar?","Supaya perbedaannya hanya karena tempat, bukan ukuran."]],[["Es di tempat panas akan ...",["mencair lebih cepat","mencair lebih lambat"],"mencair lebih cepat","☀️","Panas membuat es cepat mencair."],["Air yang didinginkan sangat lama bisa menjadi ...",["es","uap"],"es","❄️","Air dingin membeku menjadi es."]],[],[CK("u1",["Sudah menebak sebelum mencoba","Sudah mengamati kedua es","Sudah menjelaskan dengan kata “karena”"])])]},

Sx("e","🗣️ English: angka 1–10",[["🔢","One sampai five","one (1), two (2), three (3), four (4), five (5). Ucapan: one “wan”, two “tu”, three “tri”, four “for”, five “faiv”.","Apa bahasa Inggris tiga?","Three."],["🔟","Six sampai ten","six (6), seven (7), eight (8), nine (9), ten (10).","Apa bahasa Inggris tujuh?","Seven."]],[["Angka 4 dalam bahasa Inggris:",["four","five","six"],"four"],["eight artinya ...",["8","7","9"],"8"],["two + three = ...",["four","five","six"],"five"]]),
Sx("i","💧 IPA: air dan wujudnya",[["💧","Air punya tiga bentuk","Air cair bisa mengalir. Es adalah air yang membeku dan keras. Uap adalah air yang menguap dan sulit terlihat.","Es adalah air dalam bentuk apa?","Es keras karena membeku."],["🚰","Air harus dihemat","Kita memakai air untuk minum, mandi, dan menyiram tanaman. Tutup keran saat tidak dipakai.","Bagaimana menghemat air?","Menutup keran saat menyikat gigi."]],[["Es batu di tempat panas akan ...",["mencair","membeku","hilang"],"mencair","🧊"],["Air di gelas bentuknya ...",["cair","padat"],"cair"],["Menghemat air dengan ...",["menutup keran","membiarkan air mengalir","membuang air"],"menutup keran","🚰"]]),
Sx("i","📞 IPS: dulu dan sekarang",[["📞","Alat dulu dan sekarang","Dulu orang menelepon dengan telepon kabel, sekarang dengan ponsel. Dulu memasak dengan kayu bakar, sekarang dengan kompor.","Alat apa dulu untuk menerangi malam hari?","Lampu minyak atau pelita."],["🕰️","Kenapa berubah?","Alat berubah karena orang menemukan cara yang lebih mudah dan cepat. Tetapi tradisi baik masih dijaga.","Apa yang berubah dari cara menelepon?","Dari telepon kabel menjadi ponsel."]],[["Dulu memasak dengan ...",["kayu bakar","microwave","kompor listrik"],"kayu bakar","🔥"],["Alat sekarang untuk menelepon ...",["ponsel","telepon kabel","surat"],"ponsel","📱"],["Alat berubah karena ...",["lebih mudah dan cepat","lebih susah","tidak ada alasan"],"lebih mudah dan cepat"]]),
Sx("t","🧩 Teka-teki hari ini",[["🧠","Mencari pola di teka-teki","Cari yang berulang atau yang berbeda. Kalau ada pola, kita bisa menebak berikutnya.","2, 4, 6, ☐","8."],["🔎","Eliminasi","Coret jawaban yang pasti salah. Sisa jawaban yang mungkin benar.","Kenapa kita coret jawaban yang salah?","Supaya pilihan tinggal sedikit dan lebih mudah memilih."]],[["Aku punya empat roda dan membawamu pergi. Aku apa?",["mobil","kursi","buku"],"mobil","🚗","Mobil beroda empat."],["Ada 5 permen, 2 dimakan. Berapa yang masih ada?",["2","3","5"],"3","🍬","5 − 2 = 3."],["Pola: ⭕⭕⬛⭕⭕⬛ ☐",["⭕","⬛"],"⭕","","Dua bulat putih lalu satu hitam, jadi berikutnya bulat putih."]])]},

Sx("m","👯 Matematika: penjumlahan sampai 20",[["👯","Bilangan kembar","6 + 6 = 12, 7 + 7 = 14, 8 + 8 = 16. Menghafal kembar membantu menjumlah cepat.","Berapa 9 + 9?","18."],["🔄","Tukar urutan","3 + 9 sama dengan 9 + 3. Mulailah dari angka yang lebih besar supaya mudah.","Berapa 2 + 9, kalau mulai dari 9?","11."]],[["7 + 7 = ☐",["13","14","15"],"14"],["6 + 7 = ☐ (kembar 6 + 6 lalu tambah 1)",["12","13","14"],"13"],["4 + 9 = ☐",["12","13","14"],"13"]],[BR([{t:"add",a:7,b:8,q:"Ada 7 bunga merah dan 8 bunga kuning. Berapa semua bunganya?",s:"Jadi ada 15 bunga."},{t:"add",a:9,b:6,q:"Dito punya 9 kelereng dan mendapat 6 lagi. Berapa semuanya?",s:"Jadi Dito punya 15 kelereng."}])]),
Sx("e","🗣️ English: bagian tubuh",[["🧍","Bagian tubuh","head (kepala), eyes (mata), ears (telinga), nose (hidung), mouth (mulut). Ucapan: head “hed”, nose “nous”.","Apa bahasa Inggris mata?","Eyes."],["🖐️","Tangan dan kaki","hand (tangan), foot (kaki, jamaknya feet), arm (lengan), leg (tungkai).","Kita punya dua tangan: hand atau hands?","Hands, karena jamak."]],[["I see with my ...",["eyes","ears","nose"],"eyes","👀"],["I hear with my ...",["ears","mouth","hands"],"ears","👂"],["I smell with my ...",["nose","eyes","feet"],"nose","👃"],["I eat with my ...",["mouth","ears","eyes"],"mouth","👄"]]),
Sx("i","🥗 IPA: makanan sehat dan gigi",[["🥗","Makanan sehat","Nasi memberi tenaga. Sayur dan buah menjaga tubuh sehat. Ikan dan telur membantu kita tumbuh.","Kenapa kita makan sayur dan buah?","Supaya tubuh sehat dan kuat."],["🦷","Menjaga gigi","Gosok gigi pagi hari dan sebelum tidur. Kurangi permen. Gigi sehat membantu kita mengunyah.","Kapan menggosok gigi?","Pagi hari dan sebelum tidur."]],[["Makanan untuk tenaga ...",["nasi","permen","es krim"],"nasi","🍚"],["Menggosok gigi sebaiknya ...",["pagi dan malam","hanya hari Minggu","tidak perlu"],"pagi dan malam","🪥"],["Yang baik untuk tubuh ...",["sayur dan buah","banyak permen","banyak minuman manis"],"sayur dan buah","🥦"]]),
Sx("i","📅 IPS: urutan waktu",[["📅","Hari dalam seminggu","Senin, Selasa, Rabu, Kamis, Jumat, Sabtu, Minggu: ada tujuh hari. Kemarin sebelum hari ini, besok sesudah hari ini.","Kalau hari ini Rabu, besok hari apa?","Kamis."],["🌅","Pagi sampai malam","Urutan sehari: pagi, siang, sore, malam. Urutan kegiatan: bangun, mandi, sarapan, sekolah, bermain, tidur.","Mana lebih dulu, sarapan atau sekolah?","Sarapan."]],[["Hari sesudah Selasa adalah ...",["Rabu","Senin","Kamis"],"Rabu"],["Hari sebelum Jumat adalah ...",["Kamis","Sabtu","Rabu"],"Kamis"],["Urutan yang benar ...",["bangun, mandi, sekolah","sekolah, bangun, mandi","mandi, sekolah, bangun"],"bangun, mandi, sekolah"]]),
Sx("t","📖 Bercerita: Dewi dan botol plastik",[["🧴","Botol di jalan","Dewi melihat botol plastik di jalan. Teman-temannya hanya melewatinya.","Menurutmu apa yang sebaiknya Dewi lakukan?","Memungut dan membuangnya ke tempat sampah."],["🗑️","Dewi bertindak","Dewi memungut botol dan memasukkannya ke tempat sampah. Penjaga sekolah tersenyum.","Kenapa tindakan kecil itu penting?","Karena banyak tindakan kecil membuat lingkungan bersih."],["🎨","Ide Dewi","Dewi menjadikan botol bersih lain sebagai pot tanaman. Teman-temannya ikut membuat.","Apa yang bisa dibuat dari botol bekas?","Pot tanaman atau tempat pensil."],["🌟","Satu orang memulai","Satu orang yang memulai bisa menggerakkan yang lain.","Apa yang bisa kamu mulai besok?","Jawaban bebas, misalnya membuang sampah pada tempatnya."]],[["Botol plastik di jalan sebaiknya ...",["dipungut dan dibuang ke tempat sampah","dibiarkan","ditendang"],"dipungut dan dibuang ke tempat sampah","🧴","Menjaga lingkungan dimulai dari tindakan kecil."]],[S(["Ceritakan ulang dengan kata-katamu sendiri.","Gambar satu hal yang bisa dibuat dari botol bekas."])])]},

Sx("m","➖ Matematika: pengurangan sampai 20",[["➖","Kurangi lewat 10","15 − 6: kurangi 5 dulu jadi 10, lalu kurangi 1 lagi jadi 9.","Berapa 13 − 5, kalau kurangi 3 dulu?","10, lalu 10 − 2 = 8."],["🔗","Keluarga fakta","7 + 8 = 15, maka 15 − 7 = 8 dan 15 − 8 = 7. Penjumlahan dan pengurangan berhubungan.","Kalau 9 + 6 = 15, berapa 15 − 9?","6."]],[["15 − 6 = ☐",["8","9","10"],"9"],["14 − 5 = ☐",["8","9","10"],"9"],["Jika 8 + 7 = 15, maka 15 − 8 = ...",["6","7","8"],"7"]],[BR([{t:"sub",w:16,p:7,q:"Ada 16 jeruk. 7 jeruk dimakan. Berapa jeruk yang tersisa?",s:"Jadi tersisa 9 jeruk."},{t:"cmp",a:12,b:7,q:"Ayu punya 12 stiker dan Bayu punya 7 stiker. Berapa selisihnya?",s:"Jadi selisihnya 5 stiker."}])]),
Sx("e","🗣️ English: I have dan I like",[["🙋","I have ...","I have two eyes. I have a pencil. I have artinya aku punya.","Bagaimana bilang “aku punya satu hidung”?","I have one nose."],["❤️","I like ...","I like apples. I like red. I like artinya aku suka.","Bagaimana bilang “aku suka warna biru”?","I like blue."]],[["Aku punya dua telinga",["I have two ears.","I like two ears.","I am two ears."],"I have two ears."],["Aku suka warna hijau",["I like green.","I have green.","I is green."],"I like green."],["I ___ a book. (aku punya buku)",["have","like","is"],"have"]]),
Sx("i","🧲 IPA: gerak benda dan magnet",[["🚪","Mendorong dan menarik","Benda bergerak kalau didorong atau ditarik. Mendorong membuat benda menjauh, menarik membuat benda mendekat.","Troli kosong kamu dorong, bergerak mendekat atau menjauh?","Menjauh."],["🧲","Magnet","Magnet menarik benda dari besi seperti paku dan penjepit kertas. Magnet tidak menarik kertas, plastik, dan kayu.","Apakah magnet menarik paku besi?","Ya, magnet menarik benda dari besi."]],[["Magnet menarik ...",["paku besi","kertas","plastik"],"paku besi","🧲"],["Benda didorong akan ...",["menjauh","mendekat"],"menjauh"],["Magnet tidak menarik ...",["penghapus karet","paku","penjepit kertas besi"],"penghapus karet"]]),
Sx("i","💰 IPS: kebutuhan dan keinginan",[["🍚","Kebutuhan","Kebutuhan adalah hal yang harus ada: makanan, minuman, pakaian, rumah.","Apa contoh kebutuhan?","Nasi, air minum, pakaian."],["🧸","Keinginan dan menabung","Keinginan adalah hal yang kita inginkan, misalnya mainan baru. Kalau ingin mainan, kita menabung dulu.","Kenapa perlu menabung?","Agar bisa membeli sesuatu yang kita inginkan nanti."]],[["Contoh kebutuhan adalah ...",["makanan","mainan baru","permen banyak"],"makanan","🍚"],["Contoh keinginan adalah ...",["mainan baru","air minum","pakaian"],"mainan baru","🧸"],["Kalau ingin mainan mahal, sebaiknya ...",["menabung","marah","minta terus"],"menabung","🐷"]]),
Sx("t","🔬 Percobaan 4: bayangan",[["🔦","Bayangan terjadi karena cahaya terhalang","Nyalakan senter di ruang redup. Letakkan benda di depan senter, bayangan muncul di dinding.","Tebak dulu: benda didekatkan ke senter, bayangan makin besar atau kecil?","Makin besar."],["📏","Mengamati dan mengubah","Jauhkan benda dari senter, bayangannya mengecil. Dekatkan, bayangannya membesar.","Bagaimana membuat bayangan lebih kecil?","Jauhkan benda dari senter."]],[["Benda didekatkan ke senter, bayangan ...",["membesar","mengecil"],"membesar","🔦","Benda dekat dengan cahaya membuat bayangan lebih besar."],["Bayangan terjadi karena benda ...",["menghalangi cahaya","menghasilkan cahaya"],"menghalangi cahaya","🌑","Benda menghalangi cahaya."],["Tanpa cahaya, bayangan ...",["tidak terbentuk","tetap ada"],"tidak terbentuk","🌙","Bayangan butuh cahaya."]],[],[CK("u4",["Sudah menebak sebelum mencoba","Sudah mengubah jarak benda","Sudah menjelaskan dengan kata “karena”"])])]},

Sx("e","🗣️ English: word family -ig dan -op",[["🐷","Kata -ig","pig (babi), big (besar), dig (menggali), wig (rambut palsu). Hanya huruf depan berganti.","Kalau p diganti b, jadi kata apa?","big."],["⬆️","Kata -op","hop (melompat), top (atas), mop (pel). Baca h + op = hop.","Baca: t + op.","top."]],[["Gambar 🐷 adalah ...",["pig","big","dig"],"pig"],["hop artinya ...",["melompat","menggali","besar"],"melompat","🐸"],["Alat membersihkan lantai ...",["mop","top","hop"],"mop","🧹"]]),

[1,2,3,4].forEach(x=>{const b=el("button","opt"+(x==w?" on":""),TESTS[x]?"Minggu "+x:`Minggu ${x} (segera)`);b.disabled=!TESTS[x];b.onclick=()=>{w=x;[...tw.children].forEach(y=>y.classList.toggle("on",y==b))};tw.append(b)});
Object.entries(SUB).forEach(([q,[e,n]])=>{const b=el("button","opt",`${e} ${n}`);b.onclick=()=>{const nama=c.querySelector("#tn").value.trim();if(!nama){er.textContent="Isi nama peserta dulu ya.";return}try{localStorage.setItem("tes_nama",nama)}catch(x){}tesMulai(w,q,nama)};c.querySelector("#tm").append(b)});
const ar=el("button","btn","📂 Arsip hasil (orang tua)");ar.onclick=tesArsip;c.append(ar);if(!API)c.append(el("p","tip","Catatan: spreadsheet belum dihubungkan, jadi hasil hanya tersimpan di perangkat ini."))}
function tesMulai(w,q,nama){const qs=TESTS[w][q],m=$("#main"),ans=[],t0=Date.now();$("#ttl").textContent=`${SUB[q][0]} Tes ${SUB[q][1]} · Minggu ${w}`;$("#sub").textContent=`Peserta: ${nama}`;m.innerHTML="";
const info=el("div","tip","Terjawab 0 dari "+qs.length);const upd=()=>info.textContent=`Terjawab ${ans.filter(x=>x!=null).length} dari ${qs.length}`;m.append(info);
qs.forEach((x,i)=>{const c=el("section","sec "+q,`<div class=q>${i+1}. ${x[0]}</div><div class=opts></div>`),o=c.querySelector(".opts");shuf(x[1]).forEach(t=>{const b=el("button","opt");b.textContent=t;b.onclick=()=>{ans[i]=t;[...o.children].forEach(y=>y.classList.toggle("on",y==b));upd()};o.append(b)});m.append(c)});
const fin=el("button","btn","Selesai dan hitung nilai");fin.onclick=()=>{const k=ans.filter(x=>x!=null).length;if(k<qs.length&&!confirm(`Masih ada ${qs.length-k} soal belum dijawab. Tetap selesai?`))return;
const d=qs.map((x,i)=>({no:i+1,q:x[0],jawab:ans[i]||"",kunci:x[2],benar:ans[i]===x[2]?1:0})),n=d.filter(x=>x.benar).length,nilai=Math.round(n/qs.length*100),dur=Math.round((Date.now()-t0)/1000);
m.innerHTML="";const r=el("section","sec "+q,`<h2>Hasil: ${nama}</h2><div class=big>${nilai}</div><div class=res>Benar ${n} dari ${qs.length}</div><div class=fb>Menyimpan hasil...</div>`);m.append(r);
d.filter(x=>!x.benar).forEach(x=>{const t=el("div","tip");t.textContent=`❌ ${x.no}. ${x.q} | Jawabanmu: ${x.jawab||"(kosong)"} | Kunci: ${x.kunci}`;m.append(t)});
const pay={action:"save",nama,minggu:w,mapel:SUB[q][1],benar:n,total:qs.length,nilai,durasi:dur,detail:d};arsipL(pay);
kirim(pay).then(z=>{r.querySelector(".fb").textContent=z=="ok"?"✅ Hasil tersimpan di spreadsheet.":z=="noapi"?"ℹ️ Spreadsheet belum dihubungkan. Hasil tersimpan di perangkat ini.":"⚠️ Gagal mengirim ke spreadsheet. Hasil tersimpan di perangkat ini."});
const bk=el("button","btn","Kembali ke menu tes");bk.onclick=tesHome;m.append(bk);scrollTo(0,0)};m.append(fin)}
function tesArsip(){const m=$("#main");m.innerHTML="";const bk=el("button","btn","← Kembali ke menu tes");bk.onclick=tesHome;m.append(bk);const c=el("section","sec tan","<h2>Arsip hasil</h2><div class=fb>Memuat...</div>");m.append(c);
const tabel=rows=>{const t=el("div","",`<div style="overflow-x:auto"><table class=tb><tr><th>Waktu</th><th>Nama</th><th>Minggu</th><th>Mapel</th><th>Benar</th><th>Nilai</th></tr></table></div>`),tb=t.querySelector("table");rows.forEach(r=>{const tr=el("tr");r.forEach(v=>{const td=el("td");td.textContent=v;tr.append(td)});tb.append(tr)});return t};
const lokal=()=>{let a=[];try{a=JSON.parse(localStorage.getItem("tes_arsip")||"[]")}catch(e){}c.querySelector(".fb").textContent=a.length?"Arsip di perangkat ini:":"Belum ada hasil di perangkat ini.";c.append(tabel(a.reverse().map(x=>[x.w,x.n,x.mg,x.mp,`${x.b}/${x.t}`,x.v])))};
if(!API)return lokal();const pin=prompt("PIN orang tua:");if(!pin)return lokal();
fetch(API+"?action=hasil&pin="+encodeURIComponent(pin)).then(r=>r.json()).then(j=>{if(!j.ok){c.querySelector(".fb").textContent="PIN salah atau data tidak tersedia.";return}c.querySelector(".fb").textContent="Arsip dari spreadsheet (200 terbaru):";c.append(tabel(j.rows.map(r=>[new Date(r[1]).toLocaleString("id-ID"),r[2],r[3],r[4],`${r[5]}/${r[6]}`,r[7]])))}).catch(()=>lokal())}
function home(){sub=null;$("#ttl").textContent="🚀 Misi Belajar Kelas 1";$("#sub").textContent="Pilih mata pelajaran dulu ya.";$("#hb").hidden=true;["#bc","#wk","#nav","#main"].forEach(q=>$(q).innerHTML="");const h=$("#home");h.hidden=false;h.innerHTML="";Object.entries(SUB).forEach(([q,[e,n]])=>{const t=cnt(q),b=el("button","sj "+q,`<span>${e}</span><b>${n}</b><small>${t[0]} dari ${t[1]} bagian selesai</small>`);b.onclick=()=>enter(q);h.append(b)});const tb=el("button","sj tes","<span>📝</span><b>Tes Mingguan</b><small>20 soal per mapel, nilai otomatis</small>");tb.onclick=tesHome;h.append(tb);scrollTo(0,0)}
function enter(q){sub=q;cur=0;const[e,n]=SUB[q];$("#home").hidden=true;$("#hb").hidden=false;$("#ttl").textContent=`${e} ${n} Kelas 1`;$("#sub").textContent="Pilih minggu, lalu hari.";const bc=$("#bc");bc.innerHTML="";const back=el("button","btn","← Ganti mapel");back.onclick=home;bc.append(back);
wkNav();view()}
home();
</script></body></html>
